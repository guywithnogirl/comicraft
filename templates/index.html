<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url("/static/images/background.jpg") center/cover fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #6c4cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5438d4;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🎨 ComicCraft</h1>
    <p class="subtitle">Turn your story idea into an AI-generated comic.</p>

    <form action="/generate" method="post">

        <label for="prompt">Story Prompt</label>
        <textarea
            id="prompt"
            name="prompt"
            placeholder="Enter your comic story idea..."
            required
        ></textarea>

        <label for="character_name">Main Character Name</label>
        <input
            type="text"
            id="character_name"
            name="character_name"
            placeholder="Enter character name"
            required
        >

        <label for="setting">Setting</label>
        <input
            type="text"
            id="setting"
            name="setting"
            placeholder="e.g. futuristic city"
            required
        >

        <label for="tone">Story Tone</label>
        <input
            type="text"
            id="tone"
            name="tone"
            placeholder="e.g. funny, adventurous, dramatic"
            required
        >

        <label for="style">Art Style</label>
        <input
            type="text"
            id="style"
            name="style"
            placeholder="e.g. anime, comic book, cinematic"
            required
        >

        <button type="submit">
            Generate Comic
        </button>

    </form>
</div>

</body>
</html>
