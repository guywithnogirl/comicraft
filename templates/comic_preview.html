<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - Preview</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .panel h2 {
            margin-top: 0;
        }

        .panel img {
            display: block;
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            margin: 15px auto;
            border-radius: 8px;
        }

        .scene {
            font-style: italic;
            color: #666;
        }

        .story {
            line-height: 1.7;
            white-space: pre-line;
        }

        .download {
            display: block;
            width: fit-content;
            margin: 30px auto;
            padding: 14px 25px;
            background: #6c4cff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .download:hover {
            background: #5438d4;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📖 Your Comic</h1>

    {% for panel in layout %}
    <div class="panel">

        <h2>
            Panel {{ panel.panel }}: {{ panel.title }}
        </h2>

        <img
            src="/{{ panel.image_path }}"
            alt="Comic Panel {{ panel.panel }}"
        >

        <p class="scene">
            {{ panel.scene_description }}
        </p>

        <div class="story">
            {{ panel.text }}
        </div>

    </div>
    {% endfor %}

    <a
        class="download"
        href="{{ pdf_path }}"
        download
    >
        📄 Download Comic PDF
    </a>

</div>

</body>
</html>
